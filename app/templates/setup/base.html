<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firstlight Setup — {{ self.step_title() }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 640px;">
    <div class="text-center mb-4">
      <h1 class="display-6 fw-bold">&#9728; Firstlight Setup</h1>
      <p class="text-muted">Step {% block step_num %}{% endblock %} of 10</p>
      <div class="progress mb-3" style="height: 6px;">
        <div class="progress-bar" style="width: {% block progress_pct %}10{% endblock %}%"></div>
      </div>
    </div>
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="card-title mb-3">{% block step_title %}{% endblock %}</h4>
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
